{% extends "base.html" %}

{% block title %}Password Reset Complete — Rovexa{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5 text-center">
      <div class="card border-0 shadow-lg rounded-4 p-4">
        <div class="avatar-circle mx-auto mb-3 bg-success text-white d-flex align-items-center justify-content-center rounded-circle" style="width:64px;height:64px;font-size:28px;">
          <i class="bi bi-shield-check"></i>
        </div>
        <h3 class="fw-bold text-dark mb-2">Password Reset Complete!</h3>
        <p class="text-muted small mb-4">Your password has been set. You can now sign in with your new credentials.</p>
        <a href="{% url 'login_portal' %}" class="btn btn-warning rounded-pill px-4 fw-bold">
          Log In Now
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
