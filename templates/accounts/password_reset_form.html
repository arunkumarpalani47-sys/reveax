{% extends "base.html" %}
{% load static %}

{% block title %}Reset Password — Rovexa{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card border-0 shadow-lg rounded-4 p-4">
        <div class="text-center mb-4">
          <div class="avatar-circle mx-auto mb-3 bg-warning text-dark d-flex align-items-center justify-content-center rounded-circle" style="width:64px;height:64px;font-size:28px;">
            <i class="bi bi-key-fill"></i>
          </div>
          <h3 class="fw-bold text-dark mb-1">Reset Password</h3>
          <p class="text-muted small">Enter your registered email address and we'll send you instructions to reset your password.</p>
        </div>

        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
              <input type="email" name="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
            </div>
          </div>

          <button type="submit" class="btn btn-warning w-100 fw-bold py-2 rounded-pill shadow-sm mb-3">
            <i class="bi bi-send-fill me-1"></i> Send Reset Link
          </button>
        </form>

        <div class="text-center">
          <a href="{% url 'login_portal' %}" class="text-decoration-none small text-muted">
            <i class="bi bi-arrow-left me-1"></i> Back to Login Portal
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
