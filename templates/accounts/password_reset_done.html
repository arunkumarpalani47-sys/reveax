{% extends "base.html" %}

{% block title %}Email Sent — Rovexa{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5 text-center">
      <div class="card border-0 shadow-lg rounded-4 p-4">
        <div class="avatar-circle mx-auto mb-3 bg-success text-white d-flex align-items-center justify-content-center rounded-circle" style="width:64px;height:64px;font-size:28px;">
          <i class="bi bi-check-lg"></i>
        </div>
        <h3 class="fw-bold text-dark mb-2">Check Your Inbox</h3>
        <p class="text-muted small mb-4">We've emailed you instructions for setting your password, if an account exists with the email you entered. You should receive them shortly.</p>
        <a href="{% url 'login_portal' %}" class="btn btn-outline-primary rounded-pill px-4">
          <i class="bi bi-box-arrow-in-right me-1"></i> Return to Login
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
