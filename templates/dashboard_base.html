{% extends 'base.html' %}

{% block layout %}

<div class="container-fluid p-0">

    <!-- Mobile Dashboard Top Navigation Pill Bar -->
    <div class="d-md-none bg-dark p-2 text-white border-bottom border-secondary">
        <div class="d-flex align-items-center justify-content-between overflow-x-auto gap-2 px-2 py-1" style="-webkit-overflow-scrolling: touch;">
            <a href="{% if request.user.role == 'ADMIN' %}{% url 'admin_dashboard' %}{% elif request.user.role == 'DRIVER' or request.user.role == 'PARTNER' %}{% url 'booking_list' %}{% else %}{% url 'customer_dashboard' %}{% endif %}" class="btn btn-sm btn-outline-warning text-nowrap rounded-pill px-3 py-1">
                <i class="bi bi-speedometer2 me-1"></i> Dashboard
            </a>
            <a href="{% url 'add_booking' %}" class="btn btn-sm btn-warning text-nowrap rounded-pill px-3 py-1 text-dark fw-bold">
                <i class="bi bi-taxi-front-fill me-1"></i> Book Taxi
            </a>
            <a href="{% url 'booking_list' %}" class="btn btn-sm btn-outline-light text-nowrap rounded-pill px-3 py-1">
                <i class="bi bi-calendar-event me-1"></i> My Bookings
            </a>
            <a href="{% url 'profile' %}" class="btn btn-sm btn-outline-light text-nowrap rounded-pill px-3 py-1">
                <i class="bi bi-person-fill me-1"></i> Profile
            </a>
        </div>
    </div>

    <div class="row g-0">

        <!-- Desktop Sidebar -->
        <div class="col-md-3 col-lg-2 bg-dark min-vh-100 p-0 d-none d-md-block">
            {% include 'sidebar.html' %}
        </div>

        <!-- Main Content Area -->
        <div class="col-12 col-md-9 col-lg-10 p-3 p-md-4" style="min-width: 0; overflow-x: hidden;">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            {% block content %}
            {% endblock %}
        </div>

    </div>

</div>

{% endblock %}
