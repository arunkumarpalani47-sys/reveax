{% extends "base.html" %}

{% block title %}Page Not Found (404) — Rovexa{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6 py-5">
      <div class="display-1 fw-bold text-warning mb-2" style="font-size: 100px;">404</div>
      <div class="mb-3 fs-1">🚕💨</div>
      <h2 class="fw-bold text-dark mb-3">Oops! You've Taken a Wrong Turn</h2>
      <p class="text-muted lead mb-4">The page or ride destination you are looking for doesn't exist or has been moved.</p>
      <div class="d-flex justify-content-center gap-3">
        <a href="{% url 'home' %}" class="btn btn-warning rounded-pill px-4 fw-bold shadow-sm">
          <i class="bi bi-house-door-fill me-1"></i> Back to Home
        </a>
        <a href="{% url 'booking_list' %}" class="btn btn-outline-secondary rounded-pill px-4">
          <i class="bi bi-journal-bookmark me-1"></i> My Bookings
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
