{% load static %}
<style>
    .sidebar-logo {
        padding: 24px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        margin-bottom: 10px;
    }
    .logo-icon {
        font-size: 28px;
        color: #f59e0b;
        background: -webkit-linear-gradient(#fbbf24, #d97706);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .logo-text {
        font-size: 24px;
        font-weight: 800;
        color: #fff;
        line-height: 1;
        letter-spacing: -0.5px;
    }
    .logo-sub {
        font-size: 11px;
        color: rgba(255,255,255,0.5);
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 600;
    }
    .nav-label {
        font-size: 10px; 
        font-weight: 700; 
        text-transform: uppercase; 
        letter-spacing: 1.5px; 
        color: rgba(255,255,255,0.25); 
        padding: 16px 20px 6px;
    }
    .sidebar-nav-link {
        display: flex; 
        align-items: center; 
        justify-content: space-between;
        padding: 11px 18px; 
        color: rgba(255,255,255,0.7); 
        text-decoration: none; 
        border-radius: 12px; 
        margin: 3px 10px; 
        font-size: 14px; 
        font-weight: 600; 
        transition: all 0.25s;
        border: 1.5px solid transparent;
    }
    .sidebar-nav-link .link-left {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .sidebar-nav-link:hover {
        background: rgba(245,158,11,0.12); 
        color: #fbbf24;
        border-color: rgba(245,158,11,0.35);
        transform: translateX(3px);
    }
    .sidebar-nav-link.active {
        background: linear-gradient(135deg, rgba(245,158,11,0.2) 0%, rgba(245,158,11,0.06) 100%);
        color: #ffffff;
        border-color: #f59e0b;
        box-shadow: 0 4px 15px rgba(245,158,11,0.2);
    }
    .sidebar-nav-link i {
        font-size: 18px;
        color: #f59e0b;
    }
    .sidebar-nav-link.text-danger:hover {
        background: rgba(239,68,68,0.15);
        color: #ef4444;
        border-color: #ef4444;
    }
</style>

<div class="sidebar-logo">
    <a href="/dashboard/" class="d-flex align-items-center text-decoration-none">
        <img src="{% static 'images/logo-white.png' %}" alt="Rovexa Cab Services" height="42" style="max-height: 42px; width: auto; object-fit: contain;">
    </a>
</div>

<div class="nav-label">MAIN</div>
<a href="/dashboard/" class="sidebar-nav-link {% if request.path == '/dashboard/' or request.path == '/admin-panel/' %}active{% endif %}">
    <div class="link-left"><i class="bi bi-speedometer2"></i> Dashboard</div>
</a>

<div class="nav-label">MANAGEMENT</div>
<a href="/vehicle/" class="sidebar-nav-link {% if '/vehicle/' in request.path %}active{% endif %}">
    <div class="link-left"><i class="bi bi-car-front-fill"></i> Fleet Catalog</div>
</a>
<a href="/admin-panel/users/" class="sidebar-nav-link {% if '/users/' in request.path %}active{% endif %}">
    <div class="link-left"><i class="bi bi-people-fill"></i> Customers & Users</div>
</a>
<a href="/admin-panel/pricing/" class="sidebar-nav-link {% if '/pricing/' in request.path %}active{% endif %}">
    <div class="link-left"><i class="bi bi-tags-fill"></i> Pricing & Coupons</div>
</a>
<a href="/admin-panel/sos/" class="sidebar-nav-link {% if '/sos/' in request.path %}active{% endif %}">
    <div class="link-left"><i class="bi bi-exclamation-triangle-fill text-danger"></i> Emergency SOS</div>
</a>

<div class="nav-label">SYSTEM</div>
<a href="/booking/" class="sidebar-nav-link {% if '/booking/' in request.path %}active{% endif %}">
    <div class="link-left"><i class="bi bi-calendar-check-fill"></i> Booking Requests</div>
    {% if pending_count and pending_count > 0 %}
    <span class="badge bg-warning text-dark rounded-pill">{{ pending_count }}</span>
    {% endif %}
</a>
<a href="/payment/" class="sidebar-nav-link {% if '/payment/' in request.path %}active{% endif %}">
    <div class="link-left"><i class="bi bi-credit-card-fill"></i> Payments & Revenue</div>
</a>
<a href="/admin-panel/reports/" class="sidebar-nav-link {% if '/reports/' in request.path %}active{% endif %}">
    <div class="link-left"><i class="bi bi-bar-chart-fill"></i> Reports</div>
</a>
<a href="/" class="sidebar-nav-link" target="_blank">
    <div class="link-left"><i class="bi bi-globe2"></i> Website</div>
</a>

<div class="mt-4 mb-4"></div>
<a href="{% url 'logout' %}" class="sidebar-nav-link text-danger">
    <div class="link-left"><i class="bi bi-box-arrow-right"></i> Logout</div>
</a>
