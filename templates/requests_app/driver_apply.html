<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become a Driver | Rovexa</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 48px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .logo-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-text {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f8fafc, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
        }
        .benefits-row {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }
        .benefit-item {
            flex: 1;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        .benefit-item:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.05);
        }
        .benefit-icon {
            font-size: 1.5rem;
            color: #8b5cf6;
            margin-bottom: 8px;
        }
        .benefit-text {
            font-size: 0.85rem;
            font-weight: 500;
        }
        .form-label {
            color: #e2e8f0;
            font-weight: 500;
            margin-bottom: 6px;
        }
        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 10px;
            padding: 12px 16px;
            transition: all 0.3s ease;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #8b5cf6;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
            color: #fff;
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        /* Custom Select Styling */
        .form-select option {
            background: #1e293b;
            color: #fff;
        }
        .submit-btn {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 14px;
            font-weight: 600;
            font-size: 1.1rem;
            width: 100%;
            margin-top: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(139, 92, 246, 0.6);
            color: white;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s;
        }
        .back-link:hover {
            color: #f8fafc;
        }
        @media (max-width: 576px) {
            .benefits-row {
                flex-direction: column;
            }
            .glass-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

<div class="glass-card">
    <div class="logo-header">
        <div class="logo-text">Rovexa</div>
        <div class="subtitle">Become a Driver</div>
        <p class="mt-2" style="color: #cbd5e1;">Drive with us. Earn more, on your schedule.</p>
    </div>

    <div class="benefits-row">
        <div class="benefit-item">
            <div class="benefit-icon"><i class="bi bi-clock-history"></i></div>
            <div class="benefit-text">Flexible Hours</div>
        </div>
        <div class="benefit-item">
            <div class="benefit-icon"><i class="bi bi-wallet2"></i></div>
            <div class="benefit-text">Weekly Payouts</div>
        </div>
        <div class="benefit-item">
            <div class="benefit-icon"><i class="bi bi-headset"></i></div>
            <div class="benefit-text">App Support</div>
        </div>
    </div>

    <form method="POST" action="{% url 'driver_apply' %}">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Full Name</label>
                <input type="text" name="full_name" class="form-control" placeholder="John Doe" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Phone Number</label>
                <input type="tel" name="phone" class="form-control" placeholder="+1 (555) 000-0000" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">License Number</label>
                <input type="text" name="license_number" class="form-control" placeholder="AB1234567" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Preferred Vehicle Type</label>
                <select name="vehicle_type" class="form-select" required>
                    <option value="" disabled selected>Select a vehicle</option>
                    <option value="Sedan">Sedan</option>
                    <option value="SUV">SUV</option>
                    <option value="Auto">Auto</option>
                    <option value="Bike">Bike</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">City</label>
                <input type="text" name="city" class="form-control" placeholder="New York" required>
            </div>
            <div class="col-12">
                <label class="form-label">Years of Experience</label>
                <input type="number" name="experience_years" class="form-control" min="0" placeholder="e.g. 5" required>
            </div>
        </div>
        
        <button type="submit" class="btn submit-btn">Submit Application</button>
        
        <div class="d-flex justify-content-between align-items-center mt-3">
            <a href="/" class="back-link mt-0"><i class="bi bi-arrow-left me-1"></i> Back to Home</a>
            <a href="{% url 'driver_login' %}" class="back-link mt-0 text-info"><i class="bi bi-box-arrow-in-right me-1"></i> Already a Driver? Login</a>
        </div>
    </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
