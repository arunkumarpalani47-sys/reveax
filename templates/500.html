{% extends "base.html" %}

{% block title %}Server Error (500) — Rovexa{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6 py-5">
      <div class="display-1 fw-bold text-danger mb-2" style="font-size: 100px;">500</div>
      <div class="mb-3 fs-1">⚠️⚙️</div>
      <h2 class="fw-bold text-dark mb-3">Internal Server Error</h2>
      <p class="text-muted lead mb-4">Something went wrong on our server. Our technical team has been notified and is working to fix it.</p>
      <div class="d-flex justify-content-center gap-3">
        <a href="{% url 'home' %}" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm">
          <i class="bi bi-house-door-fill me-1"></i> Back to Home
        </a>
        <a href="{% url 'contact' %}" class="btn btn-outline-danger rounded-pill px-4">
          <i class="bi bi-headset me-1"></i> Contact Support
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
